  <style>
    :root {
      --paper: #f4ede1;
      --paper-bright: #fffaf2;
      --ink: #171714;
      --ink-soft: #4a443c;
      --orange: #e85d0c;
      --orange-dark: #bd4204;
      --line: rgba(23, 23, 20, .17);
      --shadow: 0 28px 80px rgba(35, 27, 20, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 0%, rgba(255, 255, 255, .95), transparent 27%),
        radial-gradient(circle at 90% 90%, rgba(232, 93, 12, .11), transparent 24%),
        var(--paper);
      font-family: "Outfit", "Segoe UI", Arial, sans-serif;

    }

    button, input, select { font: inherit; }

    .page {
      display: flex;
      width: 100%;
      min-height: 100svh;
      max-width: 100%;
      flex-direction: column;
      overflow-x: hidden;
    }

    .brandline {
      display: grid;
      width: calc(100% - 96px);
      max-width: 1490px;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 28px;
      margin: 0 auto;
      padding: 16px 0 24px;
    }

    .brandline::before,
    .brandline::after {
      content: "";

      background: rgba(23, 23, 20, .33);
    }

    .brand {
      color: var(--ink);

      font-size: 35px;
      font-weight: 700;
      letter-spacing: -.045em;
      text-decoration: none;
    }

    .brand span { color: var(--orange); }
    .brand-logo { display:block; width:min(210px, 44vw); height:auto; }
    footer .footer-brand-logo { display:block; width:min(172px, 42vw); height:auto; }

    .content {
      display: grid;
      width: min(1180px, calc(100% - 64px));
      flex: 1;
      grid-template-columns: minmax(0, .86fr) minmax(430px, 1fr);
      gap: 100px;
      align-items: center;
      margin: 0 auto;
      padding: 80px 0 92px;
    }

    .eyebrow {
      margin: 0 0 25px;
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .34em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      margin: 0 0 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(54px, 6vw, 86px);
      letter-spacing: -.052em;
      line-height: .96;
      text-wrap: balance;
    }

    .lead {
      max-width: 540px;
      margin: 0;
      color: var(--ink-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(21px, 2vw, 27px);

    .form-card {
      padding: 46px;
      border: 1px solid rgba(23, 23, 20, .12);
      border-radius: 28px;
      background: var(--paper-bright);
      box-shadow: var(--shadow);
    }

    .field { margin-bottom: 22px; }

    label {
      display: block;
      margin-bottom: 9px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      min-height: 56px;
      padding: 13px 16px;
      border: 1px solid rgba(23, 23, 20, .2);
      border-radius: 13px;
      color: var(--ink);
      background: #fff;
      font-size: 19px;
      outline: none;
      transition: border-color .25s ease, box-shadow .25s ease;
    }

    input:focus,
    select:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(232, 93, 12, .13);
    }

    .button {
      display: inline-flex;
      width: 100%;
      min-height: 64px;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      padding: 17px 30px;
      border: 0;
      border-radius: 16px;

      font-size: 23px;

    .button:hover,

      box-shadow: 0 24px 50px rgba(197, 68, 5, .32);

    .button:hover,.button:focus-visible { box-shadow:0 24px 46px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.18); filter:none; }
    .button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }
    .form-status-msg {
      display: none;
      margin-top: 14px;
      padding: 12px 16px;

    }
    .form-status-msg.error {
      display: block;

      color: #991b1b;
      border: 1px solid #f87171;
    }
    .form-status-msg.success {
      display: block;

    }
    input.is-invalid, select.is-invalid {
      border-color: #dc2626 !important;
      background: #fff8f8 !important;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, .12) !important;
    }
    .group-info { color:#3f3f3f; font-size:13px; }
    .privacy { color:#777; font-size:12px; }
    .consent-fields { display:grid; gap:12px; margin:22px 0 20px; }
    .consent-field { display:grid; grid-template-columns:18px minmax(0,1fr); gap:10px; align-items:start; }
    .consent-field input[type="checkbox"] { width:18px; min-width:18px; min-height:18px; height:18px; margin:2px 0 0; padding:0; accent-color:#161616; }
    .consent-field label { margin:0; color:#565656; font-size:11px; font-weight:500; line-height:1.45; }
    .consent-field a { color:#1b1b1b; font-weight:650; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:2px; }
    .consent-field input[type="checkbox"].is-invalid { outline:2px solid #dc2626; outline-offset:2px; }
    footer { border-color:rgba(19,19,19,.11); color:#686868; background:#fff; }
    @media (max-width:560px) {
      .brand { font-size:24px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }

  <main class="page">
    <div class="brandline">
      <img class="brand-logo" src="../../logo-empleagilidad-gris.svg" alt="Empleagilidad.com" />
    </div>

    <section class="content">
      <div class="intro">
        <p class="eyebrow">Programa para profesionales con experiencia</p>
        <h1>Déjanos tus datos para ver las condiciones de ingreso.</h1>
        <p class="lead">Con esto te reservamos un lugar mientras revisas el detalle del programa.</p>
      </div>

      <form class="form-card" id="application-form" action="#" method="post" novalidate>
        <div class="field">
          <label for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="correo">Correo</label>
          <input id="correo" name="correo" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="whatsapp">WhatsApp</label>
          <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" placeholder="Ejemplo +51 y el número completo" required />
        </div>

        <div class="field">
          <label for="situacion">Hace cuánto estás buscando trabajo</label>
          <select id="situacion" name="situacion" required>
            <option value="menos-de-un-mes">Menos de un mes</option>
            <option value="entre-1-y-3-meses">Entre 1 y 3 meses</option>
            <option value="entre-3-y-6-meses">Entre 3 y 6 meses</option>
            <option value="mas-de-6-meses">Más de 6 meses</option>
            <option value="tengo-trabajo-y-quiero-cambiar">Tengo trabajo y quiero cambiar</option>
          </select>
        </div>

        <div class="consent-fields">
          <div class="consent-field">
            <input id="acepta-politicas" name="acepta_politicas" type="checkbox" required />
            <label for="acepta-politicas">Acepto los <a href="../politicas/" target="_blank" rel="noopener noreferrer">Términos y Condiciones</a> y la <a href="../politicas/" target="_blank" rel="noopener noreferrer">Política de Privacidad</a> del programa Empleagilidad.</label>
          </div>
          <div class="consent-field">
            <input id="autoriza-comunicaciones" name="autoriza_comunicaciones" type="checkbox" />
            <label for="autoriza-comunicaciones">Autorizo a Doctor CV SAC a enviarme información comercial y promocional. Puedo retirar mi consentimiento en cualquier momento.</label>
          </div>
        </div>

        <button class="button" type="submit" disabled>Ver el programa completo</button>
        <div id="form-status-msg" class="form-status-msg" role="alert"></div>
        <p class="group-info">Grupo de 15 · inicio Noviembre 2026</p>
        <p class="privacy">Tus datos no se comparten con terceros.</p>
      </form>
    </section>

    <footer>
      <img class="footer-brand-logo" src="../../logo-empleagilidad-gris.svg" alt="Empleagilidad.com" />
      <div>Programa para profesionales con experiencia</div>
    </footer>

  <script>
    (() => {
      // ==========================================================
      // CONFIGURACIÓN DE INTEGRACIÓN Y CHECKOUT
      // ==========================================================
      const CONFIG = {
        apiBaseDomain: 'https://app.jobbox.ai',

        landingCheckoutPath: '/api/v1/jobbox/landing-checkout/',

        // Ruta hacia la página de oferta
        offerPageUrl: '../oferta/',

        // Ruta hacia la página de confirmación/gracias (enviada al backend como success_url)
        successPageUrl: '../gracias/',

        // Nombre del parámetro query para transportar el UID de la orden
        queryParamName: 'order_uid',

        // Tag de segmentación para ActiveCampaign
        tagName: 'interesado'
      };

      // ==========================================================
      // CAPTURA Y ATRIBUCIÓN DE CONVERSIONES (GA4, META CAPI, UTMS)
      // ==========================================================
      const ATTRIBUTION_STORAGE_KEY = 'empleagilidad_attribution';

      const getCookie = (name) => {
        try {
          const match = document.cookie.match(new RegExp('(?:^|;\\s*)' + name.replace(/([.*+?^${}()|[\]/\\])/g, '\\$1') + '=([^;]*)'));
          return match ? decodeURIComponent(match[1]) : '';
        } catch (_) {
          return '';
        }
      };

      const getSavedAttribution = () => {
        try {
          const stored = sessionStorage.getItem(ATTRIBUTION_STORAGE_KEY) || localStorage.getItem(ATTRIBUTION_STORAGE_KEY);
          return stored ? JSON.parse(stored) : {};
        } catch (_) {
          return {};
        }
      };

      const saveAttribution = (data) => {
        try {
          const merged = { ...getSavedAttribution(), ...data };
          const json = JSON.stringify(merged);
          sessionStorage.setItem(ATTRIBUTION_STORAGE_KEY, json);
          localStorage.setItem(ATTRIBUTION_STORAGE_KEY, json);
        } catch (_) {}
      };

      // Extraer y persistir parámetros presentes en la URL actual
      const currentUrlParams = new URLSearchParams(window.location.search);
      const urlTrackingData = {};
      const trackingKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'fbclid', 'gclid'];
      trackingKeys.forEach((key) => {
        const val = currentUrlParams.get(key);
        if (val && val.trim()) {
          urlTrackingData[key] = val.trim();
        }
      });
      if (Object.keys(urlTrackingData).length > 0) {
        saveAttribution(urlTrackingData);
      }

      /**
       * Extrae el client_id de GA4 de la cookie _ga (formato GA1.1.123456789.1710000000)
       */
      const getGaClientId = () => {
        const gaCookie = getCookie('_ga');
        if (!gaCookie) return '';
        const parts = gaCookie.split('.');
        return parts.length >= 4 ? parts.slice(2).join('.') : gaCookie;
      };

      /**
       * Extrae el session_id de GA4 desde cookies de contenedor _ga_* (formato GS1.1.1710000000...)
       */
      const getGaSessionId = () => {
        try {
          const cookies = document.cookie.split(';');
          for (let cookie of cookies) {
            const [rawName, rawVal] = cookie.trim().split('=');
            if (rawName && rawName.startsWith('_ga_') && rawVal) {
              const val = decodeURIComponent(rawVal);
              const parts = val.split('.');
              if (parts.length >= 3 && parts[2]) {
                return parts[2];
              }
            }
          }
        } catch (_) {}
        return '';
      };

      /**
       * Recolecta todos los datos consolidados de atribución para Meta CAPI y GA4
       */
      const collectAttribution = () => {
        const saved = getSavedAttribution();

        const utm_source = currentUrlParams.get('utm_source') || saved.utm_source || '';
        const utm_medium = currentUrlParams.get('utm_medium') || saved.utm_medium || '';
        const utm_campaign = currentUrlParams.get('utm_campaign') || saved.utm_campaign || '';
        const utm_content = currentUrlParams.get('utm_content') || saved.utm_content || '';
        const utm_term = currentUrlParams.get('utm_term') || saved.utm_term || '';
        const fbclid = currentUrlParams.get('fbclid') || saved.fbclid || '';
        const gclid = currentUrlParams.get('gclid') || saved.gclid || '';

        const fbp = getCookie('_fbp') || '';
        let fbc = getCookie('_fbc') || '';
        if (!fbc && fbclid) {
          fbc = `fb.1.${Date.now()}.${fbclid}`;
        }

        const gaClientId = getGaClientId();
        const gaSessionId = getGaSessionId();

        return {
          utm_source,
          utm_medium,
          utm_campaign,
          utm_content,
          utm_term,
          fbclid,
          gclid,
          fbp,
          fbc,
          ga_client_id: gaClientId,
          ga_session_id: gaSessionId
        };
      };

      /**
       * Construye una URL absoluta robusta a partir de una ruta relativa,
       * tomando en cuenta el origen, pathname actual y presencia de trailing slashes.
       */
      const getAbsoluteUrl = (relativeOrAbsoluteUrl) => {
        const currentUrl = new URL(window.location.href);
        // Si el pathname no termina en '/' y no es un archivo (ej: .html), asegurar '/'
        // para que las rutas relativas ('../') resuelvan correctamente al directorio padre
        if (!currentUrl.pathname.endsWith('/') && !currentUrl.pathname.split('/').pop().includes('.')) {
          currentUrl.pathname += '/';
        }
        return new URL(relativeOrAbsoluteUrl, currentUrl).href;
      };

      const form = document.getElementById('application-form');
      if (!form) return;

      const submitBtn = form.querySelector('button[type="submit"]');
      const statusMsg = document.getElementById('form-status-msg');
      const nombreInput = document.getElementById('nombre');
      const correoInput = document.getElementById('correo');
      const whatsappInput = document.getElementById('whatsapp');
      const situacionSelect = document.getElementById('situacion');
      const aceptaPoliticasInput = document.getElementById('acepta-politicas');
      const autorizaComunicacionesInput = document.getElementById('autoriza-comunicaciones');

      const updateSubmitAvailability = () => {
        if (submitBtn) submitBtn.disabled = !Boolean(aceptaPoliticasInput?.checked);
      };

      const showMessage = (msg, isError = true) => {
        if (!statusMsg) return;
        statusMsg.textContent = msg;
        statusMsg.className = `form-status-msg ${isError ? 'error' : 'success'}`;
        statusMsg.style.display = 'block';
      };

      const clearMessage = () => {
        if (!statusMsg) return;
        statusMsg.textContent = '';
        statusMsg.className = 'form-status-msg';
        statusMsg.style.display = 'none';
      };

      [nombreInput, correoInput, whatsappInput, situacionSelect].forEach((input) => {
        if (!input) return;
        input.addEventListener('input', () => {
          input.classList.remove('is-invalid');
          clearMessage();
        });
        if (input.tagName === 'SELECT') {
          input.addEventListener('change', () => {
            input.classList.remove('is-invalid');
            clearMessage();
          });
        }
      });
      aceptaPoliticasInput?.addEventListener('change', () => {
        aceptaPoliticasInput.classList.remove('is-invalid');
        updateSubmitAvailability();
        clearMessage();
      });
      updateSubmitAvailability();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessage();

        const nombre = nombreInput ? nombreInput.value.trim() : '';
        const correo = correoInput ? correoInput.value.trim() : '';
        const whatsapp = whatsappInput ? whatsappInput.value.trim() : '';
        const situacion = situacionSelect ? situacionSelect.value : '';
        const aceptaPoliticas = Boolean(aceptaPoliticasInput?.checked);
        const autorizaComunicaciones = Boolean(autorizaComunicacionesInput?.checked);

        let hasError = false;
        if (!nombre) {
          nombreInput?.classList.add('is-invalid');
          hasError = true;
        }
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!correo || !emailRegex.test(correo)) {
          correoInput?.classList.add('is-invalid');
          hasError = true;
        }
        if (!whatsapp) {
          whatsappInput?.classList.add('is-invalid');
          hasError = true;
        }
        if (!aceptaPoliticas) {
          aceptaPoliticasInput?.classList.add('is-invalid');
          hasError = true;
        }

        if (hasError) {
          showMessage('Por favor completa todos los campos requeridos con datos válidos.');
          return;
        }

        const originalBtnText = submitBtn ? submitBtn.textContent : '';
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Enviando postulación...';
        }

        try {
          const base = CONFIG.apiBaseDomain.replace(/\/+$/, '');
          const path = CONFIG.landingCheckoutPath.startsWith('/') ? CONFIG.landingCheckoutPath : `/${CONFIG.landingCheckoutPath}`;
          const endpointUrl = `${base}${path}`;

          // Construir URL absoluta hacia la página de gracias para redirección tras pago exitoso
          const successUrl = getAbsoluteUrl(CONFIG.successPageUrl);

          const attribution = collectAttribution();

          const payload = {
            nombre,
            correo,
            email: correo,
            whatsapp,
            phone: whatsapp,
            situacion: situacion || '',
            acepta_politicas: aceptaPoliticas,
            autoriza_comunicaciones: autorizaComunicaciones,
            tag_name: CONFIG.tagName,
            success_url: successUrl,

            // Campaña y Atribución UTM
            utm_source: attribution.utm_source,
            utm_medium: attribution.utm_medium,
            utm_campaign: attribution.utm_campaign,
            utm_content: attribution.utm_content,
            utm_term: attribution.utm_term,

            // Meta Ads (Conversions API)
            fbclid: attribution.fbclid,
            fbp: attribution.fbp,
            _fbp: attribution.fbp,
            fbc: attribution.fbc,
            _fbc: attribution.fbc,

            // Google Analytics 4 (Measurement Protocol)
            client_id: attribution.ga_client_id,
            ga_client_id: attribution.ga_client_id,
            session_id: attribution.ga_session_id,
            ga_session_id: attribution.ga_session_id,

            // Contexto de origen
            landing_url: window.location.href,
            referrer: document.referrer || ''
          };

          const response = await fetch(endpointUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(payload)
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => null);
            const errorMsg = errorData?.detail || errorData?.message || `Error del servidor (${response.status}).`;
            throw new Error(errorMsg);
          }

          const data = await response.json();
          const orderUid = data.order_uid || data.uid;

          if (!orderUid) {
            throw new Error('La respuesta del servidor no incluyó el identificador de orden (order_uid).');
          }

          if (submitBtn) {
            submitBtn.textContent = '¡Listo! Redirigiendo...';
          }

          // Redirigir a la página de oferta adjuntando el UID como query param
          const targetUrl = new URL(getAbsoluteUrl(CONFIG.offerPageUrl));
          targetUrl.searchParams.set(CONFIG.queryParamName, orderUid);

          // Preservar UTMs y parámetros de tracking (URL o memoria)
          const currentParams = new URLSearchParams(window.location.search);
          const savedAttribution = getSavedAttribution();
          Object.keys(savedAttribution).forEach((k) => {
            if (!currentParams.has(k) && savedAttribution[k]) {
              currentParams.set(k, savedAttribution[k]);
            }
          });
          currentParams.forEach((val, key) => {
            if (key !== CONFIG.queryParamName) {
              targetUrl.searchParams.set(key, val);
            }
          });

          window.location.href = targetUrl.toString();
        } catch (err) {
          console.error('[Application Form] Error al enviar postulación:', err);
          showMessage(err.message || 'Ocurrió un error al procesar tu postulación. Por favor intenta nuevamente.');
          if (submitBtn) {
            submitBtn.disabled = !Boolean(aceptaPoliticasInput?.checked);
            submitBtn.textContent = originalBtnText;
          }
        }
      });
    })();
  </script>
</body>
</html>
